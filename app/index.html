<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tameem's DevOps Lab</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 640px;
      margin: 24px;
      padding: 40px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #1e293b;
    }
    h1 { color: #38bdf8; }
    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 20px;
      background: #064e3b;
      color: #6ee7b7;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Version 1.0</span>
    <h1>Tameem's DevOps Lab</h1>
    <p>A hands-on project using Docker, Kubernetes, and CI/CD.</p>
    <p>Built by Shaik Tameem Ibrahim</p>
  </main>
</body>
</html>
